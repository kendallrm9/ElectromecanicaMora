<div
  style="
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background-color: #ffffff;
  "
>
  <!-- Logo -->
  <div style="text-align: left; padding-bottom: 10px">
    <img
      src="https://electromecanicamora.com/images/generales/logo-principal.webp"
      alt="Logo de la empresa"
      style="width: 150px"
    />
  </div>

  <!-- Título -->
  <h2 style="color: #000; text-align: center; margin-bottom: 20px">
    Solicitud de Servicios
  </h2>

  <!-- Tabla con la información -->
  <table
    style="
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      border-radius: 10px;
      overflow: hidden;
    "
  >
    <tr>
      <th
        style="
          background-color: #000;
          color: white;
          padding: 12px;
          text-align: left;
          font-size: 14px;
        "
      >
        Dato
      </th>
      <th
        style="
          background-color: #000;
          color: white;
          padding: 12px;
          text-align: left;
          font-size: 14px;
        "
      >
        Información
      </th>
    </tr>
    <tr>
      <td
        style="
          border-bottom: 1px solid #ddd;
          padding: 10px;
          background-color: #f2f2f2;
        "
      >
        <strong>Nombre:</strong>
      </td>
      <td style="border-bottom: 1px solid #ddd; padding: 10px">
        ' . $nombre . '
      </td>
    </tr>
    <tr>
      <td
        style="
          border-bottom: 1px solid #ddd;
          padding: 10px;
          background-color: #f2f2f2;
        "
      >
        <strong>Teléfono:</strong>
      </td>
      <td style="border-bottom: 1px solid #ddd; padding: 10px">
        ' . $telefono . '
      </td>
    </tr>
    <tr>
      <td
        style="
          border-bottom: 1px solid #ddd;
          padding: 10px;
          background-color: #f2f2f2;
        "
      >
        <strong>Email:</strong>
      </td>
      <td style="border-bottom: 1px solid #ddd; padding: 10px">
        <a
          href="mailto:' . $email . '"
          style="color: #000; text-decoration: none; font-weight: bold"
          >' . $email . '</a
        >
      </td>
    </tr>
    <tr>
      <td
        style="
          border-bottom: 1px solid #ddd;
          padding: 10px;
          background-color: #f2f2f2;
        "
      >
        <strong>Capacitación:</strong>
      </td>
      <td style="border-bottom: 1px solid #ddd; padding: 10px">
        ' . $capacitacion . '
      </td>
    </tr>
    <tr>
      <td
        style="
          border-bottom: 1px solid #ddd;
          padding: 10px;
          background-color: #f2f2f2;
        "
      >
        <strong>Mensaje:</strong>
      </td>
      <td style="border-bottom: 1px solid #ddd; padding: 10px">
        ' . $mensaje . '
      </td>
    </tr>
  </table>

  <!-- Footer con fecha y hora de envío -->
  <p
    style="
      margin-top: 20px;
      margin-left: 5px;
      font-size: 12px;
      color: #555;
      text-align: left;
    "
  >
    Enviado el: ' . $fecha_envio . '
  </p>
</div>
